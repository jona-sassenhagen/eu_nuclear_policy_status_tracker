<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EU Nuclear Sources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Libre+Franklin:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="sources">
    <div class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">Evidence and references</p>
          <h1>Country Source Directory</h1>
          <p class="intro">
            One section per EU country with the status shown on the dashboard,
            supporting notes, and the current curated news links.
          </p>
        </div>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html">Dashboard</a>
          <a class="nav-link is-active" href="sources.html">Sources</a>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            Dark mode
          </button>
        </nav>
      </header>

      <main class="sources-main">
        <section class="sources-toolbar">
          <label class="search-label" for="country-search">Filter countries</label>
          <input
            id="country-search"
            class="country-search"
            type="search"
            placeholder="Search by country or status"
          />
        </section>
        <section id="sources-list" class="sources-list" aria-live="polite"></section>
      </main>
    </div>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
